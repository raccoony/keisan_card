<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ひらがな・カタカナカード</title>
  <style>
    :root{ --pad: 14px; }

    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body{
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);

      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #topbar{
      position: fixed;
      top: env(safe-area-inset-top);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      padding: var(--pad);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    #modes, #stats{
      pointer-events: auto;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn{
      font-size: 18px;
      line-height: 1;
      padding: 10px 12px;
      border: 1px solid #000;
      border-radius: 10px;
      background: transparent;
      color: #000;
    }

    .btn[aria-pressed="true"]{
      background: #000;
      color: #fff;
    }

    .btn:disabled{
      opacity: 0.35;
      border-style: dashed;
    }

    #stats{
      font-size: 18px;
      opacity: 0.6;
      gap: 10px;
    }

    #card{
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #char{
      font-weight: 700;
      font-size: clamp(96px, 16vw, 240px);
      letter-spacing: 0.04em;
    }

    #hint{
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      opacity: 0.35;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="modes" aria-label="モード">
      <button class="btn" id="modeHira" aria-pressed="true">ひらがな</button>
      <button class="btn" id="modeKata" aria-pressed="false">カタカナ</button>
      <button class="btn" id="modeMix" aria-pressed="false">まぜる</button>
    </div>
    <div id="stats" aria-label="進捗">
      <span id="count">0</span>
    </div>
  </div>

  <main id="card" aria-label="ひらがな・カタカナカード">
    <div id="char" aria-live="polite">—</div>
  </main>

  <div id="hint">タップで読み上げ / もう一回タップで次へ</div>

  <script>
    (() => {
      'use strict';

      document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
      document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
      document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('dblclick', (e) => e.preventDefault());

      const card = document.getElementById('card');
      const charEl = document.getElementById('char');
      const countEl = document.getElementById('count');

      const modeHiraBtn = document.getElementById('modeHira');
      const modeKataBtn = document.getElementById('modeKata');
      const modeMixBtn = document.getElementById('modeMix');

      const hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
      let cachedVoice = null;

      let mode = 'hira'; // 'hira' | 'kata' | 'mix'
      let solvedCount = 0;
      let spokenOnce = false;

      const makeEntries = (chars) => chars.map(ch => ({ char: ch, read: ch }));

      const hiraBasic = makeEntries([
        'あ','い','う','え','お',
        'か','き','く','け','こ',
        'さ','し','す','せ','そ',
        'た','ち','つ','て','と',
        'な','に','ぬ','ね','の',
        'は','ひ','ふ','へ','ほ',
        'ま','み','む','め','も',
        'や','ゆ','よ',
        'ら','り','る','れ','ろ',
        'わ','を','ん'
      ]);

      const kataBasic = makeEntries([
        'ア','イ','ウ','エ','オ',
        'カ','キ','ク','ケ','コ',
        'サ','シ','ス','セ','ソ',
        'タ','チ','ツ','テ','ト',
        'ナ','ニ','ヌ','ネ','ノ',
        'ハ','ヒ','フ','ヘ','ホ',
        'マ','ミ','ム','メ','モ',
        'ヤ','ユ','ヨ',
        'ラ','リ','ル','レ','ロ',
        'ワ','ヲ','ン'
      ]);

      const hiraDakuten = makeEntries([
        'が','ぎ','ぐ','げ','ご',
        'ざ','じ','ず','ぜ','ぞ',
        'だ','ぢ','づ','で','ど',
        'ば','び','ぶ','べ','ぼ'
      ]);

      const kataDakuten = makeEntries([
        'ガ','ギ','グ','ゲ','ゴ',
        'ザ','ジ','ズ','ゼ','ゾ',
        'ダ','ヂ','ヅ','デ','ド',
        'バ','ビ','ブ','ベ','ボ'
      ]);

      const hiraHandakuten = makeEntries(['ぱ','ぴ','ぷ','ぺ','ぽ']);
      const kataHandakuten = makeEntries(['パ','ピ','プ','ペ','ポ']);

      const hiraSokuon = [{ char: 'っ', read: '小さいつ' }];
      const kataSokuon = [{ char: 'ッ', read: '小さいつ' }];

      const hiraYoon = makeEntries([
        'きゃ','きゅ','きょ',
        'しゃ','しゅ','しょ',
        'ちゃ','ちゅ','ちょ',
        'にゃ','にゅ','にょ',
        'ひゃ','ひゅ','ひょ',
        'みゃ','みゅ','みょ',
        'りゃ','りゅ','りょ',
        'ぎゃ','ぎゅ','ぎょ',
        'じゃ','じゅ','じょ',
        'びゃ','びゅ','びょ',
        'ぴゃ','ぴゅ','ぴょ',
        'ぢゃ','ぢゅ','ぢょ'
      ]);

      const kataYoon = makeEntries([
        'キャ','キュ','キョ',
        'シャ','シュ','ショ',
        'チャ','チュ','チョ',
        'ニャ','ニュ','ニョ',
        'ヒャ','ヒュ','ヒョ',
        'ミャ','ミュ','ミョ',
        'リャ','リュ','リョ',
        'ギャ','ギュ','ギョ',
        'ジャ','ジュ','ジョ',
        'ビャ','ビュ','ビョ',
        'ピャ','ピュ','ピョ',
        'ヂャ','ヂュ','ヂョ'
      ]);

      const hiraAll = [
        ...hiraBasic,
        ...hiraDakuten,
        ...hiraHandakuten,
        ...hiraSokuon,
        ...hiraYoon
      ];

      const kataAll = [
        ...kataBasic,
        ...kataDakuten,
        ...kataHandakuten,
        ...kataSokuon,
        ...kataYoon
      ];

      let current = hiraAll[0];

      function pickNext(){
        const pool = (mode === 'hira') ? hiraAll : (mode === 'kata') ? kataAll : [...hiraAll, ...kataAll];
        current = pool[Math.floor(Math.random() * pool.length)];
        charEl.textContent = current.char;
        spokenOnce = false;
      }

      function loadVoices(){
        if (!hasTTS) return;
        try {
          const voices = window.speechSynthesis.getVoices();
          if (!voices || voices.length === 0) return;

          cachedVoice =
            voices.find(v => (v.lang || '').toLowerCase().startsWith('ja')) ||
            voices.find(v => (v.lang || '').toLowerCase().includes('ja')) ||
            null;
        } catch (_) {
          // 取得できない環境は無視
        }
      }

      function speak(text){
        if (!hasTTS) return;
        try {
          window.speechSynthesis.cancel();

          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP';
          u.rate = 1.0;
          u.pitch = 1.0;
          u.volume = 1.0;
          if (cachedVoice) u.voice = cachedVoice;
          window.speechSynthesis.speak(u);
        } catch (_) {
          // 例外は無視
        }
      }

      function handleTap(){
        if (!spokenOnce) {
          if (hasTTS) {
            speak(current.read);
          }
          spokenOnce = true;
          solvedCount += 1;
          countEl.textContent = solvedCount;
        } else {
          pickNext();
        }
      }

      function bindTap(el, handler, { stopPropagation = false } = {}){
        let ignoreClick = false;

        el.addEventListener('touchend', (e) => {
          e.preventDefault();
          if (stopPropagation) e.stopPropagation();
          ignoreClick = true;
          setTimeout(() => { ignoreClick = false; }, 400);
          handler();
        }, {passive:false});

        el.addEventListener('click', (e) => {
          e.preventDefault();
          if (stopPropagation) e.stopPropagation();
          if (ignoreClick) { ignoreClick = false; return; }
          handler();
        });
      }

      function setMode(next){
        mode = next;
        modeHiraBtn.setAttribute('aria-pressed', String(mode === 'hira'));
        modeKataBtn.setAttribute('aria-pressed', String(mode === 'kata'));
        modeMixBtn.setAttribute('aria-pressed', String(mode === 'mix'));
        pickNext();
      }

      bindTap(card, handleTap);
      bindTap(modeHiraBtn, () => setMode('hira'), { stopPropagation: true });
      bindTap(modeKataBtn, () => setMode('kata'), { stopPropagation: true });
      bindTap(modeMixBtn, () => setMode('mix'), { stopPropagation: true });

      if (hasTTS) {
        loadVoices();
        try {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        } catch (_) {}
      }

      pickNext();

      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          handleTap();
        }
      });
    })();
  </script>
</body>
</html>
