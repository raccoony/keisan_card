<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>九九カード</title>
  <style>
    :root{ --pad: 14px; }

    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body{
      /* iPadのダブルタップズーム抑止（対応ブラウザ） */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);

      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #topbar{
      position: fixed;
      top: env(safe-area-inset-top);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      padding: var(--pad);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      pointer-events: none; /* 全面タップの邪魔をしない */
    }

    #modes, #stats{
      pointer-events: auto; /* ボタンだけ有効 */
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn{
      font-size: 18px;
      line-height: 1;
      padding: 10px 12px;
      border: 1px solid #000;
      border-radius: 10px;
      background: transparent;
      color: #000;
    }

    .btn[aria-pressed="true"]{
      background: #000;
      color: #fff;
    }

    .btn:disabled{
      opacity: 0.35;
      border-style: dashed;
    }

    #stats{
      font-size: 18px;
      opacity: 0.6;
      gap: 10px;
    }

    #card{
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #expr{
      font-weight: 700;
      font-size: clamp(72px, 13vw, 200px);
      letter-spacing: 0.02em;
    }

    #ansWrap{
      margin-top: 0.20em;
      display: flex;
      align-items: baseline;
      gap: 0.25em;
      font-weight: 700;
      font-size: clamp(72px, 13vw, 200px);
      visibility: hidden; /* 答えは最初は非表示（高さは保持） */
    }

    #eq{
      font-weight: 600;
      opacity: 0.7;
    }

    #hint{
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0;
      right: 0;
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      opacity: 0.35;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn:focus-visible, .selection-grid button:focus-visible{
      outline: 3px solid #1769aa;
      outline-offset: 2px;
    }

    #selectionDialog{
      box-sizing: border-box;
      width: calc(100% - 24px);
      max-width: 680px;
      max-height: calc(100% - 24px);
      max-height: calc(100dvh - 24px);
      padding: 18px;
      border: 2px solid #000;
      border-radius: 16px;
      background: #fff;
      color: #000;
      overflow: hidden;
    }

    #selectionDialog[open]{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #selectionDialog::backdrop{ background: rgba(0,0,0,0.45); }

    .selection-heading, .selection-actions, .selection-footer{
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .selection-heading, .selection-footer{ justify-content: space-between; }
    #selectionDialog > header{ flex-shrink: 0; }
    .selection-heading h1{ margin: 0; font-size: 24px; }
    #selectionHelp{ margin: 8px 0 0; font-size: 15px; line-height: 1.6; }
    #selectionDialog .btn{ min-height: 44px; background: #fff; }
    #selectionDialog .primary-btn{ background: #000; color: #fff; }
    .selection-scroll{ min-height: 0; overflow: auto; overscroll-behavior: contain; }

    .selection-grid{
      width: 100%;
      min-width: 492px;
      table-layout: fixed;
      border-spacing: 4px;
      text-align: center;
    }

    .selection-grid th, .selection-grid td{ padding: 0; }
    .selection-grid button{
      width: 100%;
      height: clamp(44px, 5.5vh, 56px);
      padding: 0;
      border: 1px solid #999;
      border-radius: 7px;
      font: inherit;
      font-size: 16px;
      color: #555;
      background: #fff;
      touch-action: manipulation;
    }

    .selection-grid th button{ font-weight: 700; background: #eee; color: #000; }
    .selection-grid .fact-cell{ touch-action: none; }
    .selection-grid .fact-cell[aria-pressed="true"]{
      border-color: #000;
      background: #000;
      color: #fff;
      font-weight: 700;
    }

    #selectionCount{ font-weight: 700; }
    #selectionError{ margin: 0; font-size: 14px; color: #a01818; }
    #selectionError:empty{ display: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="modes" aria-label="モード">
      <button class="btn" id="modeMul" aria-pressed="true">九九</button>
      <button class="btn" id="selectionBtn" aria-haspopup="dialog" aria-controls="selectionDialog">出題設定</button>
      <button class="btn" id="voiceBtn" aria-pressed="true">音声ON</button>
      <button class="btn" id="speedBtn" aria-pressed="true" style="display:none;">速</button>
    </div>
    <div id="stats" aria-label="進捗">
      <span id="count">0</span>
    </div>
  </div>

  <main id="card" aria-label="九九カード">
    <div id="expr" aria-live="polite">—</div>
    <div id="ansWrap" aria-live="polite"><span id="eq">=</span><span id="ans">—</span></div>
  </main>

  <div id="hint">タップで答え / もう一回タップで次の問題</div>

  <dialog id="selectionDialog" aria-labelledby="selectionTitle" aria-describedby="selectionHelp">
    <header>
      <div class="selection-heading">
        <h1 id="selectionTitle">出題する九九</h1>
        <button class="btn" id="cancelSelection" autofocus>キャンセル</button>
      </div>
      <p id="selectionHelp">マスをタップ・なぞって選択／解除。黒いマスを出題します。<br>左の数字は「段」、上の数字は「かける数」をまとめて切り替えます。</p>
    </header>
    <div class="selection-actions">
      <button class="btn" id="selectAll">全選択</button>
      <button class="btn" id="clearSelection">全解除</button>
    </div>
    <div class="selection-scroll">
      <table class="selection-grid" id="selectionGrid" aria-label="出題する九九の選択表"></table>
    </div>
    <p id="selectionError" role="status"></p>
    <footer class="selection-footer">
      <span id="selectionCount" aria-live="polite" aria-atomic="true"></span>
      <button class="btn primary-btn" id="applySelection">適用</button>
    </footer>
  </dialog>

  <script>
    (() => {
      'use strict';

      // ---- iPadのズーム抑止（ダブルタップ / ピンチ） ----
      document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
      document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
      document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        // 設定画面は各ボタンのタップ処理と、マスのPointer Eventsで操作する。
        if (e.target.closest('#selectionDialog')) return;
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('dblclick', (e) => e.preventDefault());

      // ---- 要素 ----
      const card = document.getElementById('card');
      const exprEl = document.getElementById('expr');
      const ansWrapEl = document.getElementById('ansWrap');
      const ansEl = document.getElementById('ans');
      const countEl = document.getElementById('count');

      const modeMulBtn = document.getElementById('modeMul');
      const selectionBtn = document.getElementById('selectionBtn');
      const selectionDialog = document.getElementById('selectionDialog');
      const selectionGrid = document.getElementById('selectionGrid');
      const selectionCount = document.getElementById('selectionCount');
      const selectionError = document.getElementById('selectionError');
      const applySelectionBtn = document.getElementById('applySelection');

      const voiceBtn = document.getElementById('voiceBtn');
      const speedBtn = document.getElementById('speedBtn');

      // ---- 状態 ----
      let showingAnswer = false;
      let solvedCount = 0;

      const selectionKey = 'kuku_cards_selection_v1';
      const allProblems = Array.from({ length: 81 }, (_, id) => {
        const a = Math.floor(id / 9) + 1;
        const b = id % 9 + 1;
        return { id, a, b, op: '×', ans: a * b };
      });
      let selectedIds = loadSelection();
      let problemPool = allProblems.filter(p => selectedIds.has(p.id));
      let draftIds = new Set();
      const cellButtons = [];
      const groupButtons = [];

      // 現在の問題
      let current = problemPool[0];

      // 読み上げ
      const hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
      let voiceOn = true;
      let voiceFast = true; // デフォルトは「速」
      let cachedVoice = null;

      function newProblem(){
        current = problemPool[Math.floor(Math.random() * problemPool.length)];
        const { a, b, op, ans } = current;

        exprEl.textContent = `${a} ${op} ${b}`;
        ansEl.textContent = `${ans}`;
        ansWrapEl.style.visibility = 'hidden';
        showingAnswer = false;

        if (voiceOn) {
          speakCurrentProblem();
        }
      }

      function revealAnswer(){
        ansWrapEl.style.visibility = 'visible';
        showingAnswer = true;
        solvedCount += 1;
        countEl.textContent = solvedCount;
        if (voiceOn) {
          speakAnswer();
        }
      }

      function handleTap(){
        if (selectionDialog.open) return;
        if (!showingAnswer) {
          revealAnswer();
        } else {
          newProblem();
        }
      }

      // ---- 出題範囲の設定 ----
      function loadSelection(){
        try {
          const saved = JSON.parse(localStorage.getItem(selectionKey));
          if (Array.isArray(saved)) {
            const valid = saved.filter(id => Number.isInteger(id) && id >= 0 && id < 81);
            if (valid.length) return new Set(valid);
          }
        } catch (_) { /* 保存が使えない場合も、その場で設定できる。 */ }
        return new Set(allProblems.map(p => p.id));
      }

      function updateSelectionUI(){
        cellButtons.forEach((button, id) => {
          button.setAttribute('aria-pressed', String(draftIds.has(id)));
        });
        groupButtons.forEach(({ button, ids }) => {
          const count = ids.filter(id => draftIds.has(id)).length;
          button.setAttribute('aria-pressed', count === 9 ? 'true' : count === 0 ? 'false' : 'mixed');
        });
        selectionCount.textContent = `${draftIds.size} / 81問 選択中`;
        applySelectionBtn.disabled = draftIds.size === 0;
        selectionError.textContent = draftIds.size === 0 ? '1問以上選んでください。' : '';
      }

      function setDraftSelection(ids, selected){
        ids.forEach(id => selected ? draftIds.add(id) : draftIds.delete(id));
        updateSelectionUI();
      }

      function makeGroupHeader(number, isRow){
        const th = document.createElement('th');
        th.scope = isRow ? 'row' : 'col';
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = number;
        button.setAttribute('aria-label', isRow ? `${number}の段をまとめて選択・解除` : `かける数が${number}の問題をまとめて選択・解除`);
        const ids = allProblems.filter(p => (isRow ? p.a : p.b) === number).map(p => p.id);
        bindTap(button, () => {
          setDraftSelection(ids, !ids.every(id => draftIds.has(id)));
        }, { stopPropagation: true });
        groupButtons.push({ button, ids });
        th.append(button);
        return th;
      }

      const headerRow = selectionGrid.createTHead().insertRow();
      const corner = document.createElement('th');
      corner.textContent = '×';
      headerRow.append(corner);
      for (let b = 1; b <= 9; b++) headerRow.append(makeGroupHeader(b, false));
      const gridBody = selectionGrid.createTBody();
      for (let a = 1; a <= 9; a++) {
        const row = gridBody.insertRow();
        row.append(makeGroupHeader(a, true));
        for (let b = 1; b <= 9; b++) {
          const id = (a - 1) * 9 + b - 1;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'fact-cell';
          button.dataset.id = id;
          button.textContent = `${a}×${b}`;
          button.setAttribute('aria-label', `${a}かける${b}`);
          cellButtons.push(button);
          row.insertCell().append(button);
        }
      }

      // なぞり始めたマスと同じ状態に揃える。同じマスを通り直しても反転させない。
      let paintPointer = null;
      let paintSelected = false;
      let paintedIds = new Set();
      function paintCell(button){
        if (!button) return;
        const id = Number(button.dataset.id);
        if (paintedIds.has(id)) return;
        paintedIds.add(id);
        setDraftSelection([id], paintSelected);
      }

      selectionGrid.addEventListener('pointerdown', e => {
        const button = e.target.closest('.fact-cell');
        if (!button || !e.isPrimary || e.button !== 0 || paintPointer !== null) return;
        e.preventDefault();
        button.focus({ preventScroll: true });
        paintPointer = e.pointerId;
        paintSelected = !draftIds.has(Number(button.dataset.id));
        paintedIds = new Set();
        selectionGrid.setPointerCapture(e.pointerId);
        paintCell(button);
      });
      selectionGrid.addEventListener('pointermove', e => {
        if (e.pointerId !== paintPointer) return;
        e.preventDefault();
        const button = document.elementFromPoint(e.clientX, e.clientY)?.closest('.fact-cell');
        if (button && selectionGrid.contains(button)) paintCell(button);
      });
      function endPaint(e){
        if (e.pointerId !== paintPointer) return;
        paintPointer = null;
        if (selectionGrid.hasPointerCapture(e.pointerId)) selectionGrid.releasePointerCapture(e.pointerId);
      }
      selectionGrid.addEventListener('pointerup', endPaint);
      selectionGrid.addEventListener('pointercancel', endPaint);
      selectionGrid.addEventListener('lostpointercapture', endPaint);
      selectionGrid.addEventListener('click', e => {
        const button = e.target.closest('.fact-cell');
        // ポインターは上で処理済み。キーボード・支援技術からのクリックだけ処理する。
        if (button && e.detail === 0) {
          const id = Number(button.dataset.id);
          setDraftSelection([id], !draftIds.has(id));
        }
      });

      bindTap(selectionBtn, () => {
        draftIds = new Set(selectedIds);
        updateSelectionUI();
        if (hasTTS) window.speechSynthesis.cancel();
        selectionDialog.showModal();
      }, { stopPropagation: true });
      bindTap(document.getElementById('selectAll'), () => {
        setDraftSelection(allProblems.map(p => p.id), true);
      }, { stopPropagation: true });
      bindTap(document.getElementById('clearSelection'), () => {
        setDraftSelection(allProblems.map(p => p.id), false);
      }, { stopPropagation: true });
      bindTap(document.getElementById('cancelSelection'), () => selectionDialog.close(), { stopPropagation: true });
      bindTap(applySelectionBtn, () => {
        if (!draftIds.size) return;
        const changed = draftIds.size !== selectedIds.size || [...draftIds].some(id => !selectedIds.has(id));
        selectedIds = new Set(draftIds);
        problemPool = allProblems.filter(p => selectedIds.has(p.id));
        try { localStorage.setItem(selectionKey, JSON.stringify([...selectedIds])); } catch (_) {}
        selectionDialog.close();
        if (changed) newProblem();
      }, { stopPropagation: true });

      // ---- 読み上げ（Web Speech API） ----
      // 行が「段」、列が「かける数」。九九独特の音便もひらがなで指定する。
      const kukuReadings = [
        ['いんいち', 'いんに', 'いんさん', 'いんし', 'いんご', 'いんろく', 'いんしち', 'いんはち', 'いんく'],
        ['にいち', 'ににん', 'にさん', 'にし', 'にご', 'にろく', 'にしち', 'にはち', 'にく'],
        ['さんいち', 'さんに', 'さざん', 'さんし', 'さんご', 'さぶろく', 'さんしち', 'さんぱ', 'さんく'],
        ['しいち', 'しに', 'しさん', 'しし', 'しご', 'しろく', 'ししち', 'しは', 'しく'],
        ['ごいち', 'ごに', 'ごさん', 'ごし', 'ごご', 'ごろく', 'ごしち', 'ごは', 'ごっく'],
        ['ろくいち', 'ろくに', 'ろくさん', 'ろくし', 'ろくご', 'ろくろく', 'ろくしち', 'ろくは', 'ろっく'],
        ['しちいち', 'しちに', 'しちさん', 'しちし', 'しちご', 'しちろく', 'しちしち', 'しちは', 'しちく'],
        ['はちいち', 'はちに', 'はっさん', 'はちし', 'はちご', 'はちろく', 'はちしち', 'はっぱ', 'はっく'],
        ['くいち', 'くに', 'くさん', 'くし', 'くご', 'くろく', 'くしち', 'くは', 'くく'],
      ];
      const kukuOnes = ['', 'いち', 'に', 'さん', 'し', 'ご', 'ろく', 'しち', 'はち', 'く'];
      const kukuTens = ['', 'じゅう', 'にじゅう', 'さんじゅう', 'しじゅう', 'ごじゅう', 'ろくじゅう', 'しちじゅう', 'はちじゅう'];

      function loadVoices(){
        if (!hasTTS) return;
        try {
          const voices = window.speechSynthesis.getVoices();
          if (!voices || voices.length === 0) return;

          // 日本語優先（iPadだと "Kyoko" 等が入っていることが多い）
          cachedVoice =
            voices.find(v => (v.lang || '').toLowerCase().startsWith('ja')) ||
            voices.find(v => (v.lang || '').toLowerCase().includes('ja')) ||
            null;
        } catch (_) {
          // 取得できない環境は無視
        }
      }

      function speak(text){
        if (!hasTTS) return;
        try {
          // 連打でキューが溜まらないように
          window.speechSynthesis.cancel();

          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP';
          u.rate = voiceFast ? 1.6 : 1.0; // 速/普
          u.pitch = 1.0;
          u.volume = 1.0;
          if (cachedVoice) u.voice = cachedVoice;

          window.speechSynthesis.speak(u);
        } catch (_) {
          // 例外は無視（端末依存のため）
        }
      }

      function speakCurrentProblem(){
        const reading = kukuReadings[current.a - 1][current.b - 1];
        // 一桁の答えには「が」を付け、問題→答えで「ににんが・し」のようにつなぐ。
        speak(reading + (current.ans < 10 ? 'が' : ''));
      }

      function speakAnswer(){
        speak(kukuTens[Math.floor(current.ans / 10)] + kukuOnes[current.ans % 10]);
      }

      function updateVoiceUI(){
        voiceBtn.setAttribute('aria-pressed', String(voiceOn));
        voiceBtn.textContent = voiceOn ? '音声ON' : (hasTTS ? '音声OFF' : '音声不可');

        if (!hasTTS) {
          voiceBtn.disabled = true;
          speedBtn.style.display = 'none';
          return;
        }

        speedBtn.style.display = voiceOn ? 'inline-block' : 'none';
        speedBtn.setAttribute('aria-pressed', String(voiceFast));
        speedBtn.textContent = voiceFast ? '速' : '普';
      }

      // ---- タップ操作（iPad向け） ----
      // touchend + click の二重発火を抑止しつつ、どの入力（指/マウス）でも動くようにする
      function bindTap(el, handler, { stopPropagation = false } = {}){
        let ignoreClick = false;

        el.addEventListener('touchend', (e) => {
          e.preventDefault();
          if (stopPropagation) e.stopPropagation();
          ignoreClick = true;
          setTimeout(() => { ignoreClick = false; }, 400);
          handler();
        }, {passive:false});

        el.addEventListener('click', (e) => {
          e.preventDefault();
          if (stopPropagation) e.stopPropagation();
          if (ignoreClick) { ignoreClick = false; return; }
          handler();
        });
      }

      bindTap(card, handleTap);

      // 九九ボタンは選択した範囲から次の問題を出す
      bindTap(modeMulBtn, () => {
        newProblem();
      }, { stopPropagation: true });

      // ---- 音声ボタン ----
      function toggleVoice(){
        if (!hasTTS) return;
        voiceOn = !voiceOn;
        updateVoiceUI();
        if (voiceOn) {
          // iOSは「ユーザー操作の中で」最初のspeakが必要なことがある
          speakCurrentProblem();
        } else {
          try { window.speechSynthesis.cancel(); } catch (_) {}
        }
      }

      function toggleSpeed(){
        voiceFast = !voiceFast;
        updateVoiceUI();
        if (voiceOn) {
          // 切り替えたら今の問題を読み直す
          speakCurrentProblem();
        }
      }

      bindTap(voiceBtn, toggleVoice, { stopPropagation: true });
      bindTap(speedBtn, toggleSpeed, { stopPropagation: true });

      // ---- 起動 ----
      if (hasTTS) {
        loadVoices();
        // voice list は遅れて来ることがある
        try {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        } catch (_) {}
      }

      updateVoiceUI();
      newProblem();

      // 外付けキーボード用：スペース/Enterで進む
      document.addEventListener('keydown', (e) => {
        if (selectionDialog.open || e.target.closest('button')) return;
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          handleTap();
        }
      });

    })();
  </script>
</body>
</html>
