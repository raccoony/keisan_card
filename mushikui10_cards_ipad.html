<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>10になる虫食い算カード</title>
  <style>
    :root { --pad: 14px; }
    html, body { height: 100%; margin: 0; background: #fff; color: #000; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
    body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #topbar { position: fixed; top: env(safe-area-inset-top); left: env(safe-area-inset-left); right: env(safe-area-inset-right); padding: var(--pad); display: flex; justify-content: space-between; pointer-events: none; }
    #controls, #stats { pointer-events: auto; display: flex; gap: 8px; align-items: center; }
    .btn { font-size: 18px; line-height: 1; padding: 10px 12px; border: 1px solid #000; border-radius: 10px; background: transparent; color: #000; }
    .btn[aria-pressed="true"] { background: #000; color: #fff; }
    .btn:disabled { opacity: .35; border-style: dashed; }
    #stats { font-size: 18px; opacity: .6; }
    #card { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    #expr, #ansWrap { font-weight: 700; font-size: clamp(64px, 12vw, 180px); letter-spacing: .02em; }
    #ansWrap { margin-top: .2em; display: flex; align-items: baseline; gap: .25em; visibility: hidden; }
    #answerLabel { font-size: .38em; font-weight: 600; opacity: .7; }
    #hint { position: fixed; bottom: env(safe-area-inset-bottom); left: 0; right: 0; padding: 12px 16px; text-align: center; font-size: 16px; opacity: .35; pointer-events: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="controls"><button class="btn" id="voiceBtn" aria-pressed="true">音声ON</button></div>
    <div id="stats" aria-label="進捗"><span id="count">0</span></div>
  </div>
  <main id="card" aria-label="合計が10になる虫食い算カード">
    <div id="expr" aria-live="polite">—</div>
    <div id="ansWrap" aria-live="polite"><span id="answerLabel">□ は</span><span id="ans">—</span></div>
  </main>
  <div id="hint">タップで答え / もう一回タップで次の問題</div>
  <script>
    (() => {
      'use strict';
      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', event => event.preventDefault(), { passive: false });
      document.addEventListener('dblclick', event => event.preventDefault());

      const card = document.getElementById('card');
      const expr = document.getElementById('expr');
      const ansWrap = document.getElementById('ansWrap');
      const ans = document.getElementById('ans');
      const count = document.getElementById('count');
      const voiceBtn = document.getElementById('voiceBtn');
      const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
      let voiceOn = hasTTS;
      let showingAnswer = false;
      let solvedCount = 0;
      let current = { shown: 1, missing: 9, blankFirst: false };

      function speak(text) {
        if (!voiceOn) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        speechSynthesis.speak(utterance);
      }

      function questionSpeech() {
        return current.blankFirst
          ? `なにか たす ${current.shown} は じゅう`
          : `${current.shown} たす なにか は じゅう`;
      }

      function newProblem() {
        const shown = Math.floor(Math.random() * 9) + 1;
        const blankFirst = Math.random() < .5;
        current = { shown, missing: 10 - shown, blankFirst };
        expr.textContent = blankFirst ? `□ ＋ ${shown} ＝ 10` : `${shown} ＋ □ ＝ 10`;
        ans.textContent = current.missing;
        ansWrap.style.visibility = 'hidden';
        showingAnswer = false;
        speak(questionSpeech());
      }

      function handleTap() {
        if (!showingAnswer) {
          ansWrap.style.visibility = 'visible';
          showingAnswer = true;
          solvedCount += 1;
          count.textContent = solvedCount;
          speak(current.missing);
        } else {
          newProblem();
        }
      }

      card.addEventListener('click', handleTap);
      voiceBtn.addEventListener('click', event => {
        event.stopPropagation();
        voiceOn = !voiceOn;
        voiceBtn.setAttribute('aria-pressed', String(voiceOn));
        voiceBtn.textContent = voiceOn ? '音声ON' : '音声OFF';
        if (!voiceOn) speechSynthesis.cancel();
        else speak(questionSpeech());
      });
      if (!hasTTS) { voiceBtn.disabled = true; voiceBtn.textContent = '音声なし'; }
      newProblem();
    })();
  </script>
</body>
</html>
